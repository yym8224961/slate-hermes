name: slate-platform
label: Slate
kind: platform
version: 0.3.2
description: Connect Slate ink-screen devices and register their Hermes device skill.
author: yym8224961
requires_env:
  - name: SLATE_BACKEND
    description: Slate backend URL, for example https://slate.example.com
    prompt: Slate backend URL
    password: false
  - name: SLATE_AGENT_TOKEN
    description: Bearer token shared with the backend HERMES_AGENT_TOKEN
    prompt: Slate Agent token
    password: true
optional_env:
  - name: SLATE_POLL_TIMEOUT_SECONDS
    description: Long-poll duration between 1 and 60 seconds (default 30)
    prompt: Slate poll timeout
    password: false
  - name: SLATE_STT_LANGUAGE
    description: Slate voice language hint (default zh; use auto to keep the provider language)
    prompt: Slate STT language
    password: false
