name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# typecheck / test 运行时需要的占位配置,任意值即可(不连真实 DB)。
env:
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
  JWT_SECRET: ci_dummy_secret_long_enough_to_pass_validation

jobs:
  lint-format:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          prisma: 'true'
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          prisma: 'true'
      - run: bun run --cwd backend test
      - run: bun run --cwd frontend test
      - name: Slate Gateway plugin regression tests
        run: python3 plugins/platforms/slate/test_adapter_voice.py
      - name: Firmware Hermes contract tests
        run: |
          c++ -std=c++17 -Ifirmware/main firmware/tests/hermes_limits_test.cc \
            -o /tmp/hermes_limits_test
          /tmp/hermes_limits_test
          c++ -std=c++17 -Ifirmware/main firmware/tests/hermes_layout_test.cc \
            -o /tmp/hermes_layout_test
          /tmp/hermes_layout_test

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run --cwd frontend build
